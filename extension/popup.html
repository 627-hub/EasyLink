<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>EasyLink</title>
    <style>
        body { width: 300px; padding: 15px; font-family: 'Microsoft YaHei', sans-serif; }
        h1 { font-size: 16px; margin: 0 0 10px 0; color: #333; }
        .status { padding: 8px; border-radius: 4px; margin: 5px 0; font-size: 13px; }
        .status.ok { background: #d4edda; color: #155724; }
        .status.error { background: #f8d7da; color: #721c24; }
        .info { font-size: 12px; color: #666; margin-top: 10px; }
    </style>
</head>
<body>
    <h1>EasyLink</h1>
    <div id="status" class="status">检测中...</div>
    <div id="info" class="info"></div>
    <script src="popup.js"></script>
</body>
</html>
